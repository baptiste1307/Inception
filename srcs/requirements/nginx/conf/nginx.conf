# Configuration principale du serveur virtuel NGINX
server {
    # 1. ECOUTE RESEAU EN HTTPS SECURISE UNIQUEMENT (PORT 443)
    # Le sujet interdit le port 80 (HTTP non chiffré).
    listen 443 ssl;
    listen [::]:443 ssl;

    # 2. NOM DE DOMAINE DU SITE
    # Obligation du sujet : login.42.fr (remplacé par votre login bpasquer)
    server_name bpasquer.42.fr;

    # 3. CONFIGURATION DES CERTIFICATS SSL/TLS
    # Emplacement de la clé privée et du certificat auto-signé générés avec OpenSSL
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # REGLE OBLIGATOIRE DU SUJET : TLSv1.2 ou TLSv1.3 UNIQUEMENT
    # Tous les anciens protocoles vulnérables (SSLv2, SSLv3, TLS 1.0, TLS 1.1) sont rejetés.
    ssl_protocols TLSv1.2 TLSv1.3;

    # 4. RACINE DU SITE WEB ET FICHIERS PAR DEFAUT
    # Dossier partagé avec le conteneur WordPress via le volume Docker
    root /var/www/html;
    index index.php index.html index.htm;

    # 5. ROUTAGE DES FICHIERS STATIQUES (IMAGES, CSS, JS)
    # Si le fichier demandé existe sur le disque, NGINX le sert directement.
    # Sinon, il transmet la requête à WordPress (index.php).
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # 6. ROUTAGE DES SCRIPTS PHP (LE PONT VERS LE CONTENEUR WORDPRESS)
    # NGINX ne sachant pas exécuter le code PHP, il transfère tous les fichiers .php
    # au conteneur "wordpress" sur le port standard FastCGI 9000.
    location ~ \.php$ {
        # Sécurité : vérifie que le fichier .php existe bien avant de l'envoyer
        try_files $uri =404;

        # Inclusion des paramètres standard FastCGI fournis par NGINX
        include fastcgi_params;

        # Découpe l'URL pour séparer le nom du script PHP des arguments
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # ENVOI DE LA REQUETE AU CONTENEUR WORDPRESS VIA LE RESEAU DOCKER
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;

        # Indique à PHP-FPM le chemin absolu du fichier à exécuter sur le disque
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
